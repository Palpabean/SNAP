[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "snaplab"
version = "0.0.1"
description = "Turn a bare computer into a self-contained Proxmox virtual lab from one USB stick"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
snaplab = "snaplab.cli:main"

[tool.setuptools.packages.find]
include = ["snaplab*"]

[tool.setuptools.package-data]
"snaplab.core.schema" = ["*.json"]
"snaplab.stages.snap" = ["*.sh"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
