# POP, last step: check the lab from inside (Design 0001, section 7.3, step 6).
# Each machine got its address from the router, reaches the router, resolves
# names through it, and reaches other networks only as its policy allows.
#
#   ansible-playbook -i inventory.ini verify.yml -e @verify.json
- name: Lab machines
  hosts: lab
  gather_facts: false
  tasks:
    - name: The machine is up (cloud-init can take a few minutes)
      ansible.builtin.wait_for_connection:
        timeout: 900

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    # labcheck.py rather than ip, ping and getent: the same on any lab machine image.
    - name: It has its reserved address from the router's DHCP
      ansible.builtin.script: labcheck.py has {{ ansible_host }}
      args:
        executable: python3
      changed_when: false

    - name: It reaches the router
      ansible.builtin.script: labcheck.py ping {{ router }}
      args:
        executable: python3
      changed_when: false

    - name: The router answers DNS
      ansible.builtin.script: labcheck.py resolve router.{{ domain }}
      args:
        executable: python3
      changed_when: false

    - name: Other networks are reachable only where the policy allows
      ansible.builtin.script: labcheck.py ping {{ item.address }}
      args:
        executable: python3
      register: reach
      changed_when: false
      failed_when: (reach.rc == 0) != item.reachable
      loop: "{{ expect }}"
      loop_control:
        label: "{{ item.network }} ({{ 'allowed' if item.reachable else 'blocked' }})"
