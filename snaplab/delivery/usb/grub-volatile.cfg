# SNAP volatile lab boot menu (snaplab build --volatile).
#
# The builder puts this file in place of Proxmox's own menu. A volatile stick
# holds no installer: it starts the ready-made Proxmox system it carries
# (snaplab/delivery/usb/volatile.py) straight from the stick, with a RAM layer
# on top, so nothing on the computer's disks is ever written. @KERNEL_EXTRA@
# adds a serial console when the stick is built with one.
#
# Only GRUB modules that Proxmox's signed GRUB provides are used, so this works
# with Secure Boot on.

# Screen: the SNAP theme when the font loads (as Proxmox's own menu does),
# plain text otherwise. The serial console always gets the text menu.
set snap_term=console
if [ x${feature_default_font_path} = xy ]; then set snap_font=unicode; else set snap_font=${prefix}/unicode.pf2; fi
if loadfont ${snap_font}; then
    set snap_gfx=y
elif loadfont ${prefix}/fonts/unicode.pf2; then
    set snap_gfx=y
fi
if [ x${snap_gfx} = xy ]; then
    if [ "${grub_platform}" = efi ]; then
        insmod efi_gop
        insmod efi_uga
    fi
    insmod all_video
    insmod gfxterm
    insmod png
    set gfxmode=1024x768,800x600,auto
    if terminal_output gfxterm; then
        set theme=${prefix}/snap/theme.txt
        export theme
        set snap_term=gfxterm
    fi
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan
insmod serial
if serial --unit=0 --speed=115200; then
    set snap_serial=y
    terminal_input console serial
    terminal_output ${snap_term} serial
else
    terminal_output ${snap_term}
fi
set timeout-style=menu
set timeout=10

function snap_text_mode {
    if [ x${snap_serial} = xy ]; then
        terminal_output console serial
    else
        terminal_output console
    fi
}

function snap_volatile {
    snap_text_mode
    echo 'SNAP: starting the volatile lab from the USB stick.'
    echo 'Nothing on this computer is changed. Leave the stick in while the lab runs.'
    set gfxpayload=keep
    linux /boot/snap/vmlinuz boot=snaplive ro quiet loglevel=3 systemd.show_status=false vt.global_cursor_default=0@KERNEL_EXTRA@
    initrd /boot/snap/initrd.img
}

menuentry 'Start the SNAP volatile lab (nothing is installed)' --id snap-volatile {
    snap_volatile
}
set default=snap-volatile

submenu 'Advanced options' {
    menuentry 'Start the volatile lab with start-up messages (for troubleshooting)' {
        snap_text_mode
        linux /boot/snap/vmlinuz boot=snaplive ro@KERNEL_EXTRA@
        initrd /boot/snap/initrd.img
    }
    menuentry "Skip the USB stick and start from the computer's own disk" {
        exit
    }
    if [ "${grub_platform}" = efi ]; then
        if [ x${lockdown} != xy ]; then
            menuentry 'Test memory (memtest86+)' {
                linux /boot/memtest86+x86_64
            }
        fi
        menuentry 'Firmware settings' {
            fwsetup
        }
    else
        menuentry 'Test memory (memtest86+)' {
            linux /boot/memtest86+x86_64
        }
    fi
}
