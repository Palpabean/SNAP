# SNAP boot menu (Design 0001, section 7.5), placed in front of Proxmox's own
# menu, which the builder keeps as /boot/grub/pve.cfg.
#
# After the unattended install the machine restarts, and if the USB stick is
# still first in the boot order it would reinstall again. So look at the
# machine first: if Proxmox VE is already installed, boot it, which runs the
# first-boot handoff. Reinstalling needs an explicit choice.
#
# The check and the boot entry match Proxmox's own "Rescue Boot" entry, so they
# only use GRUB modules that Proxmox's signed GRUB provides (Secure Boot).
insmod lvm
insmod ext2

if test -e (lvm/pve-root)/boot/pve/vmlinuz; then
    insmod serial
    if serial --unit=0 --speed=115200; then
        terminal_input --append serial
        terminal_output --append serial
    fi
    echo 'SNAP: Proxmox VE is already installed on this machine.'
    set timeout-style=menu
    set timeout=5
    set default=0

    menuentry 'SNAP: start the installed Proxmox VE and continue setup' --class debian --class os {
        echo 'Starting the installed Proxmox VE ...'
        linux (lvm/pve-root)/boot/pve/vmlinuz ro root=/dev/mapper/pve-root quiet
        initrd (lvm/pve-root)/boot/pve/initrd.img
    }

    submenu 'SNAP: reinstall Proxmox VE (ERASES the target disk)' {
        source /boot/grub/pve.cfg
    }
else
    source /boot/grub/pve.cfg
fi
