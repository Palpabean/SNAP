# SNAP boot menu (Design 0001, section 5.2).
#
# The builder puts this file in place of Proxmox's own menu, so it is the only
# menu the user sees. @PVE_LINUX@ and @PVE_INITRD@ are filled in at build time
# from the "Install Proxmox VE (Automated)" entry of Proxmox's menu.
#
# It looks at the machine before offering anything: if Proxmox VE is already
# installed it continues setup instead of reinstalling, and it shows how far
# setup has got from the marker files each stage writes under
# /var/lib/snap/progress/ on the installed system.
#
# Only GRUB modules that Proxmox's signed GRUB provides are used, so this works
# with Secure Boot on. The install check matches Proxmox's own Rescue Boot.

insmod lvm
insmod ext2

# Screen: the SNAP theme when the font loads (as Proxmox's own menu does),
# plain text otherwise. The serial console always gets the text menu.
set snap_term=console
if [ x${feature_default_font_path} = xy ]; then set snap_font=unicode; else set snap_font=${prefix}/unicode.pf2; fi
if loadfont ${snap_font}; then
    set snap_gfx=y
elif loadfont ${prefix}/fonts/unicode.pf2; then
    set snap_gfx=y
fi
if [ x${snap_gfx} = xy ]; then
    if [ "${grub_platform}" = efi ]; then
        insmod efi_gop
        insmod efi_uga
    fi
    insmod all_video
    insmod gfxterm
    insmod png
    set gfxmode=1024x768,800x600,auto
    # Only theme the menu once graphics work. GRUB also reports success on a machine
    # with no display adapter at all (not seen on real PCs), where entries then fail.
    if terminal_output gfxterm; then
        set theme=${prefix}/snap/theme.txt
        export theme
        set snap_term=gfxterm
    fi
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan
insmod serial
if serial --unit=0 --speed=115200; then
    set snap_serial=y
    terminal_input console serial
    terminal_output ${snap_term} serial
else
    terminal_output ${snap_term}
fi
set timeout-style=menu

set snap_disk=(lvm/pve-root)
set snap_progress=${snap_disk}/var/lib/snap/progress

# Entries print in plain text, which also works on a serial console.
function snap_text_mode {
    if [ x${snap_serial} = xy ]; then
        terminal_output console serial
    else
        terminal_output console
    fi
}

function snap_install {
    snap_text_mode
    echo 'SNAP: starting the unattended Proxmox VE install.'
    echo 'The installer shows its progress next; the computer restarts when it is done.'
    linux @PVE_LINUX@
    initrd @PVE_INITRD@
}

function snap_start_installed {
    snap_text_mode
    echo 'SNAP: starting the installed Proxmox VE.'
    linux ${snap_disk}/boot/pve/vmlinuz ro root=/dev/mapper/pve-root quiet
    initrd ${snap_disk}/boot/pve/initrd.img
}

# Progress, read from the machine.
set s1='[ ]'; set s2='[ ]'; set s3='[ ]'; set s4='[ ]'
if test -e ${snap_disk}/boot/pve/vmlinuz; then
    set snap_installed=y
    set s1='[~]'
    if test -e ${snap_progress}/snap.done; then set s1='[x]'; fi
    if test -e ${snap_progress}/crackle.done; then set s2='[x]'; fi
    if test -e ${snap_progress}/pop.done; then set s3='[x]'; fi
    if test -e ${snap_progress}/bang.done; then set s4='[x]'; fi
fi
set snap_status="Progress:  ${s1} 1 Install   ${s2} 2 Host   ${s3} 3 Network+VMs   ${s4} 4 Finish"

if [ x${snap_installed} = xy ]; then
    set timeout=5
    if [ x${s4} = 'x[x]' ]; then
        menuentry 'Start my lab (Proxmox VE)' --id snap-main {
            snap_start_installed
        }
    else
        menuentry 'Continue setting up my lab' --id snap-main {
            snap_start_installed
        }
    fi
else
    set timeout=10
    menuentry 'Install Proxmox VE and build my lab' --id snap-main {
        snap_install
    }
fi
set default=snap-main

menuentry "${snap_status}" --id snap-progress {
    configfile ${prefix}/grub.cfg
}

submenu 'Advanced options' {
    if [ x${snap_installed} = xy ]; then
        submenu 'Reinstall Proxmox VE (ERASES the target disk)' {
            menuentry 'No, go back' {
                configfile ${prefix}/grub.cfg
            }
            menuentry 'Yes, erase the target disk and reinstall' {
                snap_install
            }
        }
    fi
    menuentry "Skip the USB stick and start from the computer's own disk" {
        exit
    }
    if [ "${grub_platform}" = efi ]; then
        if [ x${lockdown} != xy ]; then
            menuentry 'Test memory (memtest86+)' {
                linux /boot/memtest86+x86_64
            }
        fi
        menuentry 'Firmware settings' {
            fwsetup
        }
    else
        menuentry 'Test memory (memtest86+)' {
            linux /boot/memtest86+x86_64
        }
    fi
}
