# End-to-end test config (tests/usb/e2e.sh). Plug-and-play like a real user:
# SNAP's built-in lab with no target disk and no passwords (the stick asks for
# the disk, here counting down on the only one, and the builder generates the
# password). Only the lab machines are made smaller, to fit a CI runner where
# they run nested inside the Proxmox VM.
machines:
  count: 1
  memory_mb: 1024
  disk_gb: 8
