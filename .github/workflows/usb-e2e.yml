name: USB end-to-end

# Build a stick from the real, pinned Proxmox ISO and run it for real in QEMU
# with KVM: unattended install, restart, stick boots the install, handoff, then
# CRACKLE, POP and BANG on the host (the lab VMs run nested). BIOS takes the
# no-questions text install from the download image (--release); UEFI runs the graphical setup wizard by itself
# (snap.wizard=auto), with pictures of its screens kept.
on:
  push:
    paths:
      - "snaplab/**"
      - "examples/**"
      - "checksums.lock"
      - "tests/usb/**"
      - ".github/workflows/usb-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          # BIOS: the download image (--release), so the lab computer picks its own password.
          - firmware: bios
            setup: text
            build: --release
          - firmware: uefi
            setup: wizard
            build: ""
    env:
      WORK: ${{ github.workspace }}/e2e-work
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU and LVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf lvm2 netpbm
      - uses: actions/cache@v4
        with:
          path: .snaplab-cache
          key: snaplab-cache-${{ hashFiles('checksums.lock') }}
      - name: Build the builder container
        run: docker build -t snaplab-builder -f snaplab/delivery/usb/Containerfile .
      - name: Build the USB image
        run: |
          docker run --rm -v "$PWD:/work" snaplab-builder build tests/usb/e2e.yaml -o snap.img --serial-console \
            --unattended ${{ matrix.setup }} ${{ matrix.build }}
          sudo chown -R "$(id -u)" .snaplab-cache snap.img*
          if [ -n "${{ matrix.build }}" ]; then
            test ! -e snap.img.password.txt  # a download image holds no password
          else
            test -s snap.img.password.txt  # no passwords in the config: the builder made one
          fi
      - name: Install, restart, hand off
        run: tests/usb/e2e.sh snap.img ${{ matrix.firmware }} ${{ matrix.setup }}
      - name: Keep the serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs-${{ matrix.firmware }}
          path: |
            e2e-work/*.log
            e2e-work/screens/*.png
          if-no-files-found: ignore
