name: Download image

# The ready-made USB image people download instead of building it themselves:
# SNAP's built-in lab, built with --release (no password in it; each lab
# computer picks its own at first start), compressed with xz, which
# balenaEtcher and Rufus write directly.
#
# A tag like v1.0.0 publishes it as a GitHub release. Any other run (a push
# that changes this workflow, or by hand) only builds it, checks it fits, and
# keeps it as a workflow artifact for a few days. (GitHub applies `paths` to
# branch pushes only, never to tags.)
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # GitHub's limit for one file in a release.
  MAX_BYTES: "2147483648"

jobs:
  # What takes the space in the image, and what smaller choices would weigh.
  sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .snaplab-cache
          key: snaplab-cache-${{ hashFiles('checksums.lock') }}
      - name: Tools
        run: sudo apt-get install -y -q --no-install-recommends qemu-utils xorriso >/dev/null
      - name: Measure
        run: |
          mib() { echo "$(( $1 / 1048576 )) MiB"; }
          remote() { curl -sIL --max-time 30 "$1" | grep -i '^content-length' | tail -1 | tr -dc 0-9; }
          {
            echo "### What takes the space"
            echo '| File | Size |'
            echo '| --- | --- |'
            find .snaplab-cache -maxdepth 2 -type f -size +5M -printf '%s %P\n' | sort -rn |
              while read -r size name; do echo "| $name | $(mib "$size") |"; done
            echo
            echo "### Smaller choices"
            nano=$(find .snaplab-cache -name 'OPNsense-*-nano-amd64.img.bz2' | head -1)
            if [ -z "$nano" ]; then
              nano=nano.img.bz2
              url=$(python3 -c 'import tomllib; print(tomllib.load(open("checksums.lock", "rb"))["opnsense"]["url"])')
              curl -fsSL -o "$nano" "$url"
            fi
            echo "- router image as published (bz2): $(mib "$(stat -c %s "$nano")")"
            echo "- router image unpacked: $(mib "$(bzcat "$nano" | wc -c)")"
            echo "- router image recompressed with xz -9: $(mib "$(bzcat "$nano" | xz -T0 -9 -c | wc -c)")"
            minimal=https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img
            echo "- Ubuntu 24.04 minimal cloud image: $(mib "$(remote "$minimal")")"
            # Cloud images are qcow2 with light (zlib) compression inside: unpacked and xz'd instead.
            raw_xz() { curl -fsSL -o img.qcow2 "$1" && qemu-img convert -O raw img.qcow2 img.raw && xz -T0 -9 -c img.raw | wc -c; rm -f img.qcow2 img.raw; }
            echo "- Ubuntu 24.04 minimal, unpacked and xz -9: $(mib "$(raw_xz "$minimal")")"
            alpine=https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/cloud/generic_alpine-3.22.5-x86_64-bios-cloudinit-r0.qcow2
            echo "- Alpine 3.22.5 cloud-init (bios), unpacked and xz -9: $(mib "$(raw_xz "$alpine")")"
            echo
            echo "### Inside the Proxmox ISO (files over 5 MiB)"
            iso=$(find .snaplab-cache -maxdepth 1 -name 'proxmox-ve_*.iso' ! -name '*-snap-*' | head -1)
            xorriso -indev "$iso" -find / -type f -exec lsdl 2>/dev/null |
              awk '$5 > 5242880 { printf "- %s: %d MiB\n", $NF, $5 / 1048576 }' | tr -d "'"
            base=https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/cloud
            for name in $(curl -s "$base/" | grep -o 'generic_alpine-3\.22\.[0-9]*-x86_64-[a-z]*-cloudinit-r[0-9]*\.qcow2' | sort -u); do
              echo "- Alpine $name: $(mib "$(remote "$base/$name")")"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .snaplab-cache
          key: snaplab-cache-${{ hashFiles('checksums.lock') }}
      - name: Build the builder container
        run: docker build -t snaplab-builder -f snaplab/delivery/usb/Containerfile .
      - name: Build the download image
        run: |
          docker run --rm -v "$PWD:/work" snaplab-builder build --release -o snap.img
          sudo chown -R "$(id -u)" .snaplab-cache snap.img snap.img.sha256
          test ! -e snap.img.password.txt  # nothing secret in a download
      - name: Compress
        id: compress
        run: |
          # To standard output: xz cannot copy the image's owner (root, from the build container).
          xz -T0 -9 --verbose --stdout snap.img > snap.img.xz
          sha256sum snap.img.xz > snap.img.xz.sha256
          ls -l snap.img snap.img.xz
          size=$(stat -c %s snap.img.xz)
          echo "### Download image" >> "$GITHUB_STEP_SUMMARY"
          echo "snap.img: $(( $(stat -c %s snap.img) / 1048576 )) MiB, snap.img.xz: $(( size / 1048576 )) MiB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -ge "$MAX_BYTES" ]; then
            echo "too_big=true" >> "$GITHUB_OUTPUT"
            echo "**Over GitHub's 2 GiB limit for one release file.**" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep it for a few days (runs without a tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: snap-download-image
          path: |
            snap.img.xz
            snap.img.xz.sha256
            snap.img.sha256
          retention-days: 5
          compression-level: 0
      - name: Check it fits in a release
        if: steps.compress.outputs.too_big == 'true'
        run: |
          echo "snap.img.xz is over GitHub's 2 GiB limit for one release file" >&2
          exit 1
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **The ready-made SNAP USB stick.** Download `snap.img.xz`, write it to a USB stick of
          8 GB or more with [balenaEtcher](https://etcher.balena.io/) (no need to unzip it first),
          and start the spare computer from the stick. Step by step:
          [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/INSTALL.md).

          This stick holds no password: each lab computer picks its own and shows it on its screen.

          To check the download: `snap.img.xz.sha256` (the file you downloaded) and
          `snap.img.sha256` (the image inside it).
          EOF
          gh release create "${{ github.ref_name }}" snap.img.xz snap.img.xz.sha256 snap.img.sha256 \
            --title "SNAP ${{ github.ref_name }}" --notes-file notes.md
