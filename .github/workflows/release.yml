name: Download image

# The ready-made USB images people download instead of building them themselves
# (snap.img.xz, the permanent lab, and snap-volatile.img.xz, the volatile lab):
# SNAP's built-in lab, built with --release (no password in it; each lab
# computer picks its own at first start), compressed with xz, which
# balenaEtcher and Rufus write directly.
#
# A tag like v1.0.0 publishes it as a GitHub release; the tag can be pushed, or made
# on GitHub's website with "Draft a new release" (the files are added to that release
# when the build finishes, about two hours later). Any other run (a push
# that changes this workflow, or by hand) only builds it, checks it fits, and
# keeps it as a workflow artifact for a few days. (GitHub applies `paths` to
# branch pushes only, never to tags.)
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # GitHub's limit for one file in a release.
  MAX_BYTES: "2147483648"

jobs:
  image:
    runs-on: ubuntu-latest
    # The first build after a new Proxmox ISO repacks its installer filesystems (about
    # 15 minutes); later builds take them from the cache.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .snaplab-cache
          key: snaplab-cache-${{ hashFiles('checksums.lock') }}
      - name: Build the builder container
        run: docker build -t snaplab-builder -f snaplab/delivery/usb/Containerfile .
      - name: Build the download image
        run: |
          docker run --rm -v "$PWD:/work" snaplab-builder build --release -o snap.img
          # The volatile lab's stick; --privileged: it installs Proxmox into a folder first.
          docker run --rm --privileged -v "$PWD:/work" snaplab-builder build --release --volatile -o snap-volatile.img
          sudo chown -R "$(id -u)" .snaplab-cache snap.img snap.img.sha256 snap-volatile.img snap-volatile.img.sha256
          test ! -e snap.img.password.txt  # nothing secret in a download
          test ! -e snap-volatile.img.password.txt
      - name: Compress
        id: compress
        run: |
          echo "### Download images" >> "$GITHUB_STEP_SUMMARY"
          for img in snap.img snap-volatile.img; do
            # To standard output: xz cannot copy the image's owner (root, from the build container).
            xz -T0 -9e --verbose --stdout "$img" > "$img.xz"
            sha256sum "$img.xz" > "$img.xz.sha256"
            ls -l "$img" "$img.xz"
            size=$(stat -c %s "$img.xz")
            echo "$img: $(( $(stat -c %s "$img") / 1048576 )) MiB, $img.xz: $(( size / 1048576 )) MiB" >> "$GITHUB_STEP_SUMMARY"
            if [ "$size" -ge "$MAX_BYTES" ]; then
              echo "too_big=true" >> "$GITHUB_OUTPUT"
              echo "**$img.xz is over GitHub's 2 GiB limit for one release file.**" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Keep it for a few days (runs without a tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: snap-download-image
          path: |
            snap.img.xz
            snap.img.xz.sha256
            snap.img.sha256
            snap-volatile.img.xz
            snap-volatile.img.xz.sha256
            snap-volatile.img.sha256
          retention-days: 5
          compression-level: 0
      - name: Check it fits in a release
        if: steps.compress.outputs.too_big == 'true'
        run: |
          echo "a download image is over GitHub's 2 GiB limit for one release file" >&2
          exit 1
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **The ready-made SNAP USB stick.** Pick one, write it to a USB stick of 8 GB or more with
          [balenaEtcher](https://etcher.balena.io/) (no need to unzip it first), and start the spare
          computer from the stick:

          - `snap.img.xz`: **permanent lab**, installed on the computer (its disk is erased).
          - `snap-volatile.img.xz`: **volatile lab**, runs from the stick and the computer's memory;
            nothing on the computer is changed, and the lab is gone when it is turned off.

          Step by step: [the install guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#install).

          These sticks hold no password: each lab computer picks its own and shows it on its screen.

          To check a download: `<file>.xz.sha256` (the file you downloaded) and `<file>.sha256`
          (the image inside it).
          EOF
          tag="${{ github.ref_name }}"
          files="snap.img.xz snap.img.xz.sha256 snap.img.sha256"
          files="$files snap-volatile.img.xz snap-volatile.img.xz.sha256 snap-volatile.img.sha256"
          if gh release view "$tag" > /dev/null 2>&1; then
            # Made on the website (which creates the tag and the release together): add the
            # files to it, and fill in the notes only if it has none.
            gh release upload "$tag" $files --clobber
            if [ -z "$(gh release view "$tag" --json body --jq .body)" ]; then
              gh release edit "$tag" --notes-file notes.md
            fi
          else
            gh release create "$tag" $files --title "SNAP $tag" --notes-file notes.md
          fi
