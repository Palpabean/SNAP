name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: shellcheck snaplab/stages/snap/*.sh
      - run: pytest -q
      - run: snaplab validate examples/snap.example.yaml

  # Check the generated answer files with Proxmox's own tool (Design 0001, D3).
  proxmox-answer:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install proxmox-auto-install-assistant (Proxmox VE 9)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl python3 python3-yaml python3-jsonschema
          curl -fsSL https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg \
            -o /usr/share/keyrings/proxmox-archive-keyring.gpg
          printf '%s\n' 'Types: deb' 'URIs: http://download.proxmox.com/debian/pve' 'Suites: trixie' \
            'Components: pve-no-subscription' 'Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg' \
            > /etc/apt/sources.list.d/pve.sources
          apt-get update
          apt-get install -y --no-install-recommends proxmox-auto-install-assistant
      - name: Render and validate answer files
        run: |
          for cfg in examples/snap.example.yaml tests/fixtures/static.yaml; do
            python3 -m snaplab answer "$cfg" -o answer.toml
            echo "== $cfg"; cat answer.toml
            proxmox-auto-install-assistant validate-answer answer.toml
          done

  # TEMPORARY: print the official ISO checksums and assistant versions to pin in checksums.lock.
  pin-info:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates curl
          curl -fsSL https://enterprise.proxmox.com/iso/SHA256SUMS | grep -E 'proxmox-ve_(8|9)'
          curl -fsSL https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg -o /usr/share/keyrings/proxmox-archive-keyring.gpg
          printf '%s\n' 'Types: deb' 'URIs: http://download.proxmox.com/debian/pve' 'Suites: trixie' \
            'Components: pve-no-subscription' 'Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg' \
            > /etc/apt/sources.list.d/pve.sources
          apt-get update && apt-cache madison proxmox-auto-install-assistant
          ls -l /dev/kvm || true
